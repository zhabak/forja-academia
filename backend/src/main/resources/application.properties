# Configuração local: não use credenciais reais em um repositório público.
# Defina DB_URL, DB_USERNAME e DB_PASSWORD no computador antes de iniciar o backend.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academia?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080
